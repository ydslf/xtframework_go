syntax = "proto3";

package xtframework.rpc;

option go_package = "xtframework/internal/rpcpb";

enum RpcOperation {
  RPC_OPERATION_UNSPECIFIED = 0;
  RPC_OPERATION_REGISTER_NODE = 1;
  RPC_OPERATION_REGISTER = 2;
  RPC_OPERATION_UNREGISTER = 3;
  RPC_OPERATION_LOOKUP = 4;
  RPC_OPERATION_DELIVER = 5;
  RPC_OPERATION_ROUTE_INVALIDATE = 6;
  RPC_OPERATION_HEARTBEAT = 7;
  RPC_OPERATION_SUBSCRIBE = 8;
  RPC_OPERATION_SERVICE_DISCOVERY = 9;
}

enum ServiceDiscoveryEventType {
  SERVICE_DISCOVERY_EVENT_TYPE_UNSPECIFIED = 0;
  SERVICE_DISCOVERY_EVENT_TYPE_SNAPSHOT = 1;
  SERVICE_DISCOVERY_EVENT_TYPE_ONLINE = 2;
  SERVICE_DISCOVERY_EVENT_TYPE_OFFLINE = 3;
}

message RpcEnvelope {
  RpcOperation operation = 1;
  bytes payload = 2;
}

message RpcResult {
  bytes payload = 1;
  string error_code = 2;
  string error_message = 3;
}

message ServiceKey {
  string name = 1;
  int64 id = 2;
}

message ServiceLocation {
  string service_name = 1;
  int64 service_id = 2;
  int64 node_id = 3;
  string node_addr = 4;
}

message RegisterNodeRequest {
  int64 node_id = 1;
  string node_addr = 2;
}

message RegisterNodeResponse {}

message HeartbeatRequest {}

message HeartbeatResponse {}

message RegisterRequest {
  ServiceLocation location = 1;
}

message RegisterResponse {}

message UnregisterRequest {
  ServiceKey target = 1;
}

message UnregisterResponse {}

message LookupRequest {
  ServiceKey target = 1;
}

message LookupResponse {
  ServiceLocation location = 1;
}

message RouteInvalidate {
  ServiceKey target = 1;
}

message SubscribeRequest {
  ServiceKey subscriber = 1;
  string service_name = 2;
}

message SubscribeResponse {}

message ServiceDiscovery {
  ServiceKey subscriber = 1;
  string service_name = 2;
  ServiceDiscoveryEventType event_type = 3;
  repeated ServiceKey services = 4;
}

message DeliverRequest {
  ServiceKey source = 1;
  ServiceKey target = 2;
  uint32 message_id = 3;
  string string_message_id = 4;
  bytes payload = 5;
}

message DeliverResponse {
  bytes payload = 1;
}
